name: Warm LiteSpeed cache (giorgostsamis.gr)

on:
  schedule:
    # Κάθε 4 ώρες στο λεπτό 17 (UTC). Το GitHub συχνά παραλείπει προγραμματισμένες εκτελέσεις,
    # άρα στην πράξη τρέχει ~2-3 φορές τη μέρα.
    # Κάθε εκτέλεση παίρνει το ΕΠΟΜΕΝΟ από τα 12 κομμάτια προϊόντων (με βάση τον αριθμό εκτέλεσης,
    # όχι την ώρα) -> πλήρης κύκλος σε 12 εκτελέσεις = 4-6 ημέρες, μέσα στις 7 της cache.
    - cron: "17 */4 * * *"
    # Επιπλέον εκτέλεση αμέσως μετά τα νυχτερινά XML imports (τρέχουν ~02:00-05:00 ώρα Ελλάδας):
    # 03:41 UTC = 05:41 χειμώνα / 06:41 καλοκαίρι. Ξαναγεμίζει πρώτα σελίδες, κατηγορίες, μάρκες.
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "desktop ή mobile (κενό = και τα δύο)"
        required: false
        default: ""
      limit:
        description: "Μέγιστος αριθμός URL (0 = όλα) — π.χ. 20 για δοκιμή"
        required: false
        default: "0"

concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Warm cache
        env:
          ONLY: ${{ github.event.inputs.only }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          CHUNK=$(( ${{ github.run_number }} % 12 ))
          ARGS="--delay 1.0 --max-minutes 160 --rotate 12 --chunk $CHUNK --limit ${LIMIT:-0}"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          python3 warm_cache.py $ARGS
